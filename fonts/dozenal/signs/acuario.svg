<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   width="620"
   height="1060"
   viewBox="0 0 620 1060"
   sodipodi:docname="acuario.svg">
  <title>acuario</title>
  <desc>Signo acuario, U+E002. Dibujar solo en la capa dibujo: relleno negro, sin trazo, dentro de la caja. La base de la caja es la linea de las cifras.</desc>
  <sodipodi:namedview
     id="view-acuario"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1"
     inkscape:showpageshadow="false"
     inkscape:pageopacity="1"
     inkscape:deskcolor="#d8d8d8"
     showguides="true"
     units="px"
     inkscape:current-layer="layer-dibujo">
    <sodipodi:guide id="guide-base-acuario" orientation="0,1" position="0,820" inkscape:label="linea de base" inkscape:locked="true"/>
    <sodipodi:guide id="guide-cap-acuario" orientation="0,1" position="0,120" inkscape:label="altura de cifra" inkscape:locked="true"/>
    <sodipodi:guide id="guide-left-acuario" orientation="1,0" position="0,0" inkscape:label="izquierda" inkscape:locked="true"/>
    <sodipodi:guide id="guide-right-acuario" orientation="1,0" position="620,0" inkscape:label="derecha" inkscape:locked="true"/>
      <sodipodi:guide id="guide-fall-acuario" orientation="0,1" position="0,1060" inkscape:label="descendente" inkscape:locked="true"/>
  </sodipodi:namedview>
  <g inkscape:groupmode="layer" id="layer-referencia" inkscape:label="referencia" sodipodi:insensitive="true">
    <image x="30" y="190" width="560" height="560" preserveAspectRatio="none" opacity="0.45" xlink:href="data:image/png;base64,"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-caja" inkscape:label="caja" sodipodi:insensitive="true">
    <rect x="0.5" y="120.5" width="619" height="699" fill="none" stroke="#c45c5c" stroke-width="1"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-dibujo" inkscape:label="dibujo"/>
</svg>
